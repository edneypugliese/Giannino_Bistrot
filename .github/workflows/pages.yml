name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Testar servidor local e versão estática
        run: node --test tests/server.test.mjs tests/pages.test.mjs
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Gerar site estático
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: node scripts/build-pages.mjs
      - name: Enviar arquivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
